<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат друзей</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Экран входа (создание профиля) -->
  <div id="loginScreen" class="screen active">
    <h2>Привет! 👋</h2>
    <p>Создай свой профиль, чтобы зайти в чат</p>
    <div class="avatarPicker" id="loginAvatarPicker"></div>
    <input id="nickInput" type="text" placeholder="Твоё имя" maxlength="20" autocomplete="off">
    <input id="statusInput" type="text" placeholder="Статус (необязательно)" maxlength="40" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button id="joinBtn">Войти в чат</button>
  </div>

  <!-- Экран списка контактов (как в WeChat) -->
  <div id="contactsScreen" class="screen">
    <header class="wxHeader">
      <h1>Чаты</h1>
      <div class="avatarBtn" id="headerAvatarBtn" title="Профиль">🙂</div>
    </header>
    <div id="contactsList" class="contactsList">
      <div id="contactsEmpty" class="emptyHint">Пока никого нет. Позови друзей открыть эту страницу и создать профиль!</div>
    </div>
  </div>

  <!-- Экран переписки с конкретным контактом -->
  <div id="chatScreen" class="screen">
    <header class="wxHeader chatHeader">
      <button id="backBtn" class="iconBtn">←</button>
      <div class="chatHeaderInfo">
        <div id="chatContactName">Имя</div>
        <div id="chatContactStatus"></div>
      </div>
    </header>
    <div id="messages">
      <div id="emptyState" class="emptyHint">Сообщений пока нет. Напиши первым!</div>
    </div>
    <form id="msgForm">
      <button type="button" id="attachBtn" class="iconBtn attachBtn" title="Фото">📷</button>
      <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
      <input id="msgInput" type="text" placeholder="Сообщение…" autocomplete="off" maxlength="500">
      <button id="sendBtn" type="submit">Отпр.</button>
    </form>
    <div id="uploadStatus" class="uploadStatus"></div>
  </div>

</div>

<!-- Модалка профиля -->
<div class="modalOverlay" id="profileModal">
  <div class="modalBox">
    <h3>Мой профиль</h3>
    <div class="avatarPicker" id="editAvatarPicker"></div>
    <input id="editNickInput" type="text" placeholder="Твоё имя" maxlength="20" autocomplete="off">
    <input id="editStatusInput" type="text" placeholder="Статус (необязательно)" maxlength="40" autocomplete="off">
    <div class="err" id="editErr"></div>
    <button class="primaryBtn" id="saveProfileBtn">Сохранить</button>
    <div class="modalRow">
      <button class="secondaryBtn" id="closeProfileBtn">Закрыть</button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
