<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат друзей</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    height: 80vh;
  }

  header {
    background: #4b3f72;
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .headerLeft {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #onlineDot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4caf50;
    display: inline-block;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .status {
    font-size: 11px;
    opacity: 0.85;
    display: flex;
    align-items: center;
  }

  .headerRight {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .avatarBtn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: #8a7fc2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    color: #fff;
  }

  /* Экран входа (ник) */
  #loginScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    gap: 12px;
    text-align: center;
    overflow-y: auto;
  }

  #loginScreen h2 {
    margin: 0 0 4px 0;
    color: #333;
  }

  #loginScreen p {
    color: #888;
    font-size: 14px;
    margin: 0 0 6px 0;
  }

  .avatarPicker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 320px;
  }

  .avatarOpt {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }

  .avatarOpt:hover { transform: scale(1.08); }
  .avatarOpt.selected { border-color: #333; }

  #nickInput, #statusInput {
    width: 100%;
    max-width: 320px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 15px;
    outline: none;
  }

  #nickInput:focus, #statusInput:focus {
    border-color: #667eea;
  }

  #joinBtn, .primaryBtn {
    width: 100%;
    max-width: 320px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  #joinBtn:hover, .primaryBtn:hover { background: #5a67d8; }

  /* Чат */
  #chatScreen {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #f4f5fb;
  }

  .msgRow {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
  }

  .msgRow.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msgRow.theirs {
    align-self: flex-start;
  }

  .rowAvatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    color: #fff;
  }

  .msg {
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.35;
    word-wrap: break-word;
    position: relative;
  }

  .msg .author {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    margin-bottom: 3px;
    opacity: 0.7;
  }

  .msg .time {
    display: block;
    font-size: 10px;
    opacity: 0.55;
    margin-top: 3px;
    text-align: right;
  }

  .msgRow.mine .msg {
    background: #667eea;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msgRow.theirs .msg {
    background: #fff;
    color: #333;
    border: 1px solid #e7e7ef;
    border-bottom-left-radius: 4px;
  }

  #emptyState {
    margin: auto;
    text-align: center;
    color: #aaa;
    font-size: 13.5px;
  }

  form#msgForm {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #fff;
    border-top: 1px solid #eee;
  }

  #msgInput {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
    outline: none;
    font-size: 14.5px;
  }

  #msgInput:focus { border-color: #667eea; }

  #sendBtn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #667eea;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #sendBtn:hover { background: #5a67d8; }
  #sendBtn:disabled { background: #c7c7d9; cursor: not-allowed; }

  .err {
    color: #e53e3e;
    font-size: 13px;
    min-height: 16px;
  }

  /* Модалка профиля */
  .modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }

  .modalOverlay.open { display: flex; }

  .modalBox {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    text-align: center;
  }

  .modalBox h3 {
    margin: 0;
    color: #333;
  }

  .modalRow {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  .secondaryBtn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #fff;
    color: #666;
    font-size: 14px;
    cursor: pointer;
  }

  .secondaryBtn:hover { background: #f5f5f5; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="headerLeft">
      <div>
        <h1>💬 Чат друзей</h1>
        <span class="status"><span id="onlineDot"></span><span id="statusText">подключение…</span></span>
      </div>
    </div>
    <div class="headerRight">
      <div class="avatarBtn" id="headerAvatarBtn" title="Профиль">🙂</div>
    </div>
  </header>

  <!-- Экран входа (создание профиля) -->
  <div id="loginScreen">
    <h2>Привет! 👋</h2>
    <p>Создай свой профиль, чтобы зайти в чат</p>

    <div class="avatarPicker" id="loginAvatarPicker"></div>

    <input id="nickInput" type="text" placeholder="Твоё имя" maxlength="20" autocomplete="off">
    <input id="statusInput" type="text" placeholder="Статус (необязательно)" maxlength="40" autocomplete="off">

    <div class="err" id="loginErr"></div>
    <button id="joinBtn">Войти в чат</button>
  </div>

  <!-- Экран чата -->
  <div id="chatScreen">
    <div id="messages">
      <div id="emptyState">Сообщений пока нет. Напиши первым!</div>
    </div>
    <form id="msgForm">
      <input id="msgInput" type="text" placeholder="Напиши сообщение…" autocomplete="off" maxlength="500">
      <button id="sendBtn" type="submit">➤</button>
    </form>
  </div>
</div>

<!-- Модалка профиля -->
<div class="modalOverlay" id="profileModal">
  <div class="modalBox">
    <h3>Мой профиль</h3>
    <div class="avatarPicker" id="editAvatarPicker"></div>
    <input id="editNickInput" type="text" placeholder="Твоё имя" maxlength="20" autocomplete="off">
    <input id="editStatusInput" type="text" placeholder="Статус (необязательно)" maxlength="40" autocomplete="off">
    <div class="err" id="editErr"></div>
    <button class="primaryBtn" id="saveProfileBtn">Сохранить</button>
    <div class="modalRow">
      <button class="secondaryBtn" id="closeProfileBtn">Закрыть</button>
    </div>
  </div>
</div>

<script type="module">
  // ==== Firebase ====
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    setDoc,
    query,
    orderBy,
    limit,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBhImSZoiZAwGHll_QcBgTls-sjmpmg1S8",
    authDomain: "kakashi-171e5.firebaseapp.com",
    projectId: "kakashi-171e5",
    storageBucket: "kakashi-171e5.firebasestorage.app",
    messagingSenderId: "130432668952",
    appId: "1:130432668952:web:7d1a67f4fa0a88ce21ba6d",
    measurementId: "G-1GN10PSTT8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ==== Аватары ====
  const AVATARS = [
    { emoji: "🙂", color: "#667eea" },
    { emoji: "😎", color: "#f6ad55" },
    { emoji: "🐱", color: "#f56565" },
    { emoji: "🐶", color: "#48bb78" },
    { emoji: "🦊", color: "#ed8936" },
    { emoji: "🐼", color: "#4a5568" },
    { emoji: "🌟", color: "#ecc94b" },
    { emoji: "🍀", color: "#38a169" },
    { emoji: "🔥", color: "#e53e3e" },
    { emoji: "🌈", color: "#9f7aea" },
    { emoji: "👾", color: "#805ad5" },
    { emoji: "🐸", color: "#48bb78" }
  ];

  // ==== Профиль пользователя (локально) ====
  function getOrCreateUserId() {
    let id = localStorage.getItem("chatUserId");
    if (!id) {
      id = "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("chatUserId", id);
    }
    return id;
  }

  const myUserId = getOrCreateUserId();

  let myProfile = {
    name: localStorage.getItem("chatNick") || "",
    status: localStorage.getItem("chatStatus") || "",
    avatarIdx: parseInt(localStorage.getItem("chatAvatarIdx") || "0", 10)
  };

  function saveProfileLocal() {
    localStorage.setItem("chatNick", myProfile.name);
    localStorage.setItem("chatStatus", myProfile.status);
    localStorage.setItem("chatAvatarIdx", String(myProfile.avatarIdx));
  }

  async function saveProfileRemote() {
    try {
      await setDoc(doc(db, "users", myUserId), {
        name: myProfile.name,
        status: myProfile.status,
        avatarIdx: myProfile.avatarIdx,
        updatedAt: serverTimestamp()
      }, { merge: true });
    } catch (err) {
      console.error("Не удалось сохранить профиль в Firestore:", err);
    }
  }

  // ==== DOM ====
  const loginScreen = document.getElementById("loginScreen");
  const chatScreen = document.getElementById("chatScreen");
  const nickInput = document.getElementById("nickInput");
  const statusInput = document.getElementById("statusInput");
  const joinBtn = document.getElementById("joinBtn");
  const loginErr = document.getElementById("loginErr");
  const messagesEl = document.getElementById("messages");
  const msgForm = document.getElementById("msgForm");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusText = document.getElementById("statusText");
  const onlineDot = document.getElementById("onlineDot");
  const headerAvatarBtn = document.getElementById("headerAvatarBtn");

  const loginAvatarPicker = document.getElementById("loginAvatarPicker");
  const editAvatarPicker = document.getElementById("editAvatarPicker");
  const profileModal = document.getElementById("profileModal");
  const editNickInput = document.getElementById("editNickInput");
  const editStatusInput = document.getElementById("editStatusInput");
  const editErr = document.getElementById("editErr");
  const saveProfileBtn = document.getElementById("saveProfileBtn");
  const closeProfileBtn = document.getElementById("closeProfileBtn");

  function buildAvatarPicker(container, selectedIdx, onSelect) {
    container.innerHTML = "";
    AVATARS.forEach((a, idx) => {
      const el = document.createElement("div");
      el.className = "avatarOpt" + (idx === selectedIdx ? " selected" : "");
      el.style.background = a.color;
      el.textContent = a.emoji;
      el.addEventListener("click", () => {
        container.querySelectorAll(".avatarOpt").forEach(o => o.classList.remove("selected"));
        el.classList.add("selected");
        onSelect(idx);
      });
      container.appendChild(el);
    });
  }

  let loginSelectedAvatar = myProfile.avatarIdx || 0;
  let editSelectedAvatar = myProfile.avatarIdx || 0;

  buildAvatarPicker(loginAvatarPicker, loginSelectedAvatar, (idx) => loginSelectedAvatar = idx);

  if (myProfile.name) {
    nickInput.value = myProfile.name;
    statusInput.value = myProfile.status;
  }

  function updateHeaderAvatar() {
    const a = AVATARS[myProfile.avatarIdx] || AVATARS[0];
    headerAvatarBtn.textContent = a.emoji;
    headerAvatarBtn.style.background = a.color;
  }

  function enterChat(name, status, avatarIdx) {
    const trimmed = name.trim();
    if (!trimmed) {
      loginErr.textContent = "Введите имя";
      return;
    }
    myProfile = { name: trimmed, status: status.trim(), avatarIdx };
    saveProfileLocal();
    saveProfileRemote();
    updateHeaderAvatar();
    loginScreen.style.display = "none";
    chatScreen.style.display = "flex";
    startListening();
  }

  joinBtn.addEventListener("click", () => enterChat(nickInput.value, statusInput.value, loginSelectedAvatar));
  nickInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enterChat(nickInput.value, statusInput.value, loginSelectedAvatar);
  });

  // ==== Модалка профиля ====
  function openProfileModal() {
    editNickInput.value = myProfile.name;
    editStatusInput.value = myProfile.status;
    editSelectedAvatar = myProfile.avatarIdx;
    editErr.textContent = "";
    buildAvatarPicker(editAvatarPicker, editSelectedAvatar, (idx) => editSelectedAvatar = idx);
    profileModal.classList.add("open");
  }

  headerAvatarBtn.addEventListener("click", openProfileModal);
  closeProfileBtn.addEventListener("click", () => profileModal.classList.remove("open"));
  profileModal.addEventListener("click", (e) => {
    if (e.target === profileModal) profileModal.classList.remove("open");
  });

  saveProfileBtn.addEventListener("click", () => {
    const trimmed = editNickInput.value.trim();
    if (!trimmed) {
      editErr.textContent = "Введите имя";
      return;
    }
    myProfile = { name: trimmed, status: editStatusInput.value.trim(), avatarIdx: editSelectedAvatar };
    saveProfileLocal();
    saveProfileRemote();
    updateHeaderAvatar();
    profileModal.classList.remove("open");
  });

  // ==== Отправка сообщений ====
  const messagesRef = collection(db, "messages");

  msgForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text) return;

    sendBtn.disabled = true;
    try {
      await addDoc(messagesRef, {
        text,
        authorId: myUserId,
        author: myProfile.name,
        avatarIdx: myProfile.avatarIdx,
        createdAt: serverTimestamp()
      });
      msgInput.value = "";
    } catch (err) {
      console.error("Ошибка отправки:", err);
      alert("Не удалось отправить сообщение. Проверь правила безопасности Firestore.");
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  });

  // ==== Получение сообщений в реальном времени ====
  function startListening() {
    const q = query(messagesRef, orderBy("createdAt", "asc"), limit(200));

    onSnapshot(
      q,
      (snapshot) => {
        onlineDot.style.background = "#4caf50";
        statusText.textContent = "онлайн";

        messagesEl.innerHTML = "";

        if (snapshot.empty) {
          messagesEl.innerHTML = '<div id="emptyState">Сообщений пока нет. Напиши первым!</div>';
          return;
        }

        snapshot.forEach((doc) => {
          const data = doc.data();
          renderMessage(data);
        });

        messagesEl.scrollTop = messagesEl.scrollHeight;
      },
      (error) => {
        console.error("Ошибка чтения:", error);
        onlineDot.style.background = "#e53e3e";
        statusText.textContent = "ошибка подключения";
      }
    );
  }

  function renderMessage(data) {
    const mine = data.authorId === myUserId;
    const avatar = AVATARS[data.avatarIdx] ?? AVATARS[0];

    const row = document.createElement("div");
    row.className = "msgRow " + (mine ? "mine" : "theirs");

    const avatarEl = document.createElement("div");
    avatarEl.className = "rowAvatar";
    avatarEl.style.background = avatar.color;
    avatarEl.textContent = avatar.emoji;

    const bubble = document.createElement("div");
    bubble.className = "msg";

    const time = data.createdAt?.toDate
      ? data.createdAt.toDate().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
      : "";

    bubble.innerHTML = `
      ${mine ? "" : `<span class="author">${escapeHtml(data.author || "Аноним")}</span>`}
      ${escapeHtml(data.text || "")}
      <span class="time">${time}</span>
    `;

    row.appendChild(avatarEl);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  updateHeaderAvatar();
</script>

</body>
</html>
